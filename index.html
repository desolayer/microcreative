<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MicroCreative</title>

    <!-- Telegram WebApp SDK — подключаем первым -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Иконки Tabler -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --purple: #a78bfa;
        --purple-dark: #2d1f5e;
        --purple-mid: #1a1333;
        --bg: #0f0f0f;
        --bg-2: #171717;
        --bg-3: #1a1a1a;
        --border: #262626;
        --border-light: #1e1e1e;
        --text: #e5e5e5;
        --text-muted: #555;
        --text-dim: #333;
        --green: #34d399;
        --amber: #f59e0b;
        --blue: #0098ea;
        --red: #ef4444;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        /* Убираем скролл и rubber-band эффект у iOS */
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
      }

      #root {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* Убираем синее выделение на тап */
      * { -webkit-tap-highlight-color: transparent; }

      /* Скроллбар */
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
